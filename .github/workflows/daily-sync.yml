name: Daily AI Pricing Sync

on:
  schedule:
    # 每天 UTC 00:00 (北京时间早 8:00) 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动一键运行

jobs:
  sync-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Pricing Sync Script
        run: bun run scripts/sync-pricing.ts

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/models.json
          if git diff --staged --quiet; then
            echo "No price updates found today."
          else
            git commit -m "chore(data): auto sync daily AI API pricing [skip ci]"
            git push
          fi
